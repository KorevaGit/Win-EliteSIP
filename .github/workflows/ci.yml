name: CI

# Сборка и тесты на каждый коммит и каждый pull request.
#
# Только windows-latest: продукт нативно оконный, половина проектов собирается
# под net10.0-windows, и зелёная сборка на Linux ничего не доказывала бы.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Версия SDK берётся из global.json — она же стоит на машине разработки.
      # Разъезд версий между CI и разработкой означал бы, что красный прогон
      # невозможно воспроизвести у себя.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Восстановление
        run: dotnet restore

      - name: Сборка
        run: dotnet build --no-restore --configuration Release

      - name: Тесты
        run: dotnet test --no-build --configuration Release --verbosity normal
